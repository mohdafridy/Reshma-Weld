<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Reshma Weld Trading Corporation | Welding Machines & Industrial Equipment</title>
    <meta
      name="description"
      content="Reshma Weld Trading Corporation supplies welding machines, cutting equipment, welding consumables, accessories and industrial equipment with sales, rental, installation, training and technical support across India."
    />
    <meta name="theme-color" content="#0a0a0b" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reshma Weld Trading Corporation" />
    <meta property="og:title" content="Reshma Weld Trading Corporation | Welding Machines & Industrial Equipment" />
    <meta
      property="og:description"
      content="Welding machines, cutting equipment, consumables, accessories and industrial equipment — sales, rental, installation, training and technical support across India."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Static shadow form for Netlify's form-detection bot, which only scans
      built HTML and never runs the React app. Field names must match the
      payload posted from ContactForm.tsx. Hidden from users; the visible
      form is rendered by React.
    -->
    <form name="enquiry" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="location" />
      <input type="text" name="requirementType" />
      <input type="text" name="product" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
